<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUERTO FUEGO — Dani Reyes</title>
<!-- Inline favicon so the page makes zero network requests. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a0f0a'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23ff8c2e' font-family='Georgia,serif'%3EP%3C/text%3E%3C/svg%3E">
<style>
  /* Dark, warm Puerto Fuego palette: burnt night, ember orange, sand. */
  :root {
    --night: #140d08;
    --ember: #ff8c2e;
    --ember-soft: #ffb35c;
    --sand: #e8cfa8;
    --sand-dim: #a98f6d;
    --panel: rgba(20, 13, 8, 0.82);
    --line: rgba(255, 140, 46, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--night); }
  body { font-family: Georgia, 'Times New Roman', serif; color: var(--sand); }

  #scene, #hud {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #scene { z-index: 0; }
  #hud { z-index: 1; pointer-events: none; }

  /* Boot splash: covers the screen until the game module reports ready. */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background:
      radial-gradient(ellipse 80% 55% at 50% 78%, rgba(255, 110, 20, 0.28), transparent 70%),
      linear-gradient(180deg, #1d1109 0%, #140d08 55%, #0d0705 100%);
    transition: opacity 0.6s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash .kicker {
    letter-spacing: 0.5em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--sand-dim);
  }
  #splash h1 {
    font-size: clamp(44px, 9vw, 96px);
    line-height: 0.95;
    letter-spacing: 0.08em;
    color: var(--ember);
    text-shadow: 0 0 34px rgba(255, 140, 46, 0.45), 0 2px 0 rgba(0, 0, 0, 0.6);
  }
  #splash h1 span { display: block; color: var(--sand); font-size: 0.52em; letter-spacing: 0.34em; }
  #splash .premise {
    max-width: 560px;
    font-size: 16px;
    line-height: 1.6;
    color: var(--sand);
    font-style: italic;
  }
  #splash .premise strong { color: var(--ember-soft); font-style: normal; }
  #splash .status { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sand-dim); }
  #splash .bar {
    width: min(320px, 70vw);
    height: 3px;
    background: rgba(232, 207, 168, 0.18);
    border-radius: 2px;
    overflow: hidden;
  }
  #splash .bar i {
    display: block;
    height: 100%;
    width: 38%;
    background: var(--ember);
    border-radius: 2px;
    animation: slide 1.1s ease-in-out infinite alternate;
  }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 62%; } }
  #splash .hint { font-size: 12px; color: var(--sand-dim); letter-spacing: 0.12em; }

  /* Boot failure: same splash, but the error is shown in plain text. */
  #splash.failed .bar { display: none; }
  #splash.failed h1 { font-size: clamp(28px, 5vw, 44px); }
  #boot-error {
    display: none;
    max-width: 640px;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ember-soft);
    font-family: ui-monospace, 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.5;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #splash.failed #boot-error { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="hud"></canvas>

  <div id="splash" role="status" aria-live="polite">
    <div class="kicker">Welcome back to</div>
    <h1>PUERTO<br>FUEGO<span>OPEN WORLD</span></h1>
    <p class="premise">
      <strong>Dani Reyes</strong> came home to bury his brother — and found the city
      that killed him. Take the streets of Puerto Fuego back, one job, one
      crew, one score at a time.
    </p>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="status" id="boot-status">Loading the city&hellip;</div>
    <pre id="boot-error"></pre>
    <div class="hint">WASD drive &middot; mouse look &middot; E interact &middot; M map</div>
  </div>

  <script type="module">
    // Boot the game. If the module fails to load (or throws while starting),
    // say so on the splash instead of leaving a silent black page: the
    // error text itself is shown so the failure can actually be fixed.
    const splash = document.getElementById('splash');
    const status = document.getElementById('boot-status');
    const errorBox = document.getElementById('boot-error');

    function showBootFailure(err) {
      const message = err instanceof Error ? (err.stack || err.message) : String(err);
      status.textContent = 'The city failed to load';
      errorBox.textContent = message;
      splash.classList.add('failed');
    }

    window.addEventListener('error', (event) => showBootFailure(event.error || event.message));
    window.addEventListener('unhandledrejection', (event) => showBootFailure(event.reason));

    try {
      const game = await import('./src/main.js');
      const start = game.start ?? game.default;
      if (typeof start !== 'function') {
        throw new Error('src/main.js exports no start() function');
      }
      await start({ scene: document.getElementById('scene'), hud: document.getElementById('hud') });
      status.textContent = 'Welcome to Puerto Fuego';
      splash.classList.add('hidden');
    } catch (err) {
      showBootFailure(err);
    }
  </script>
</body>
</html>
